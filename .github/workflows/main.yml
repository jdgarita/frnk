name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: compile & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Seed local.properties (CI dummy values)
        run: |
          cp local.properties.template local.properties
          # BuildKonfig needs these set; CI does not exercise real backends.
          sed -i 's|SUPABASE_URL=.*|SUPABASE_URL=https://ci.invalid|' local.properties
          sed -i 's|SUPABASE_ANON_KEY=.*|SUPABASE_ANON_KEY=ci-dummy|' local.properties
          sed -i 's|FIREBASE_API_KEY=.*|FIREBASE_API_KEY=ci-dummy|' local.properties
          sed -i 's|FIREBASE_APPLICATION_ID=.*|FIREBASE_APPLICATION_ID=ci-dummy|' local.properties
          sed -i 's|FIREBASE_PROJECT_ID=.*|FIREBASE_PROJECT_ID=ci-dummy|' local.properties
          sed -i 's|BUILD_VARIANT=.*|BUILD_VARIANT=debug|' local.properties

      # `compileAndroidMain` covers every KMP module's commonMain + androidMain
      # under the AGP 9 KMP-Android plugin (com.android.kotlin.multiplatform.library).
      # `:androidDemoApp:compileDebugKotlin` covers the pure-Android smoke harness.
      # Gradle parallelises across modules automatically (org.gradle.parallel=true).
      - name: Compile (Android, all modules in parallel)
        run: ./gradlew compileAndroidMain :androidDemoApp:compileDebugKotlin --parallel --build-cache

      # KMP modules (com.android.kotlin.multiplatform.library) expose their host unit
      # tests as `testAndroidHostTest` (commonTest + androidHostTest), NOT `testDebugUnitTest`.
      # `:androidDemoApp` is a com.android.application, so its unit tests stay on `testDebugUnitTest`.
      - name: Unit tests
        run: ./gradlew testAndroidHostTest :androidDemoApp:testDebugUnitTest --parallel --build-cache

org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
kotlin.mpp.enableCInteropCommonization=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# KGP 2.4 turns on SwiftPM import whenever a dependency's klib declares Swift packages (posthog-kmp
# does), then links a synthetic package through a clang wrapper — which
# Xcode 27 feeds swiftc-only linker flags, so every iOS compile fails. frnk never wanted it: the
# native SDKs (PostHog, Sentry, RevenueCat) are linked by the consuming Xcode target via SPM, as
# demo/ios-app and every host already do. Hosts set the same flag (Faint's mobile/gradle.properties).
kotlin.disableSwiftPMImport=true

[versions]
agp = "9.2.1"
kotlin = "2.3.21"
compose-multiplatform = "1.11.0"
compose-unstyled = "2.4.0"
ripple-indication = "1.1.0"
coroutines = "1.11.0"
serialization = "1.11.0"
datetime = "0.8.0"
koin = "4.2.1"
sqldelight = "2.3.2"
settings = "1.3.0"
ktor = "3.5.0"
viewmodel = "2.10.0"
navigation = "2.9.2"
gitlive-firebase = "2.4.0"
firebase-bom = "34.13.0"
google-services = "4.4.4"
firebase-crashlytics-gradle = "3.0.7"
crashkios = "0.9.0"
supabase = "3.6.0"
revenuecat = "3.0.2"
multihaptic = "0.3.2"
robolectric = "4.15.1"
# AndroidX Compose UI version that compose-multiplatform 1.11.0 resolves to on Android — used only to
# pin the matching ui-test-manifest artifact (provides the ComponentActivity the Compose test host launches).
# ⚠️ BUMP TOGETHER WITH `compose-multiplatform`: this is the lone hand-pinned AndroidX Compose version in
# the catalog (everything else routes through the CMP plugin). On a CMP upgrade, re-resolve the value via
# `./gradlew :shared-ui-atoms:dependencies --configuration androidHostTestRuntimeClasspath | grep 'compose.ui:ui:'`
# and update this to match, or ui-test-manifest can lag the rest of the compose-ui graph (obscure
# ComponentActivity/test-host failures rather than a clear version conflict).
androidx-compose-ui = "1.11.1"
# Calf adaptive nav bar: native UITabBar on iOS / Material3 NavigationBar on Android. Lives in the
# :shared-ui-nav module (the toolkit's sole, deliberate Material3 dependency).
calf = "0.12.0"
ktlint = "14.2.0"
iconsLucide = "2.2.1"
androidx-activity = "1.13.0"
# Android SDK targets exposed to composite-build host apps (Still + future hosts) so they inherit the
# toolkit's SDK floor/ceiling from the shared catalog (see HOST_ALIGNMENT.md → "Inherit build config").
# This is the SINGLE source of truth for SDK targets — the `frnk.kmp.library` convention plugin, the
# special modules' build scripts (via `libs.versions.android.compileSdk.get().toInt()`), and composite-
# build host apps all read these. compileSdk is 36 because AGP 9 caps compileSdk at 36.
android-minSdk = "26"
android-compileSdk = "36"
android-targetSdk = "36"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "serialization" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }

koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }

androidx-lifecycle-viewmodel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "viewmodel" }
androidx-lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "viewmodel" }
androidx-navigation = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "navigation" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }

sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
sqldelight-coroutines = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }
sqldelight-android-driver = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
sqldelight-native-driver = { module = "app.cash.sqldelight:native-driver", version.ref = "sqldelight" }
sqldelight-sqlite-driver = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }

settings-core = { module = "com.russhwolf:multiplatform-settings", version.ref = "settings" }
settings-coroutines = { module = "com.russhwolf:multiplatform-settings-coroutines", version.ref = "settings" }

ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-serialization = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-android = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }

firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebase-bom" }
firebase-auth = { module = "dev.gitlive:firebase-auth", version.ref = "gitlive-firebase" }
firebase-firestore = { module = "dev.gitlive:firebase-firestore", version.ref = "gitlive-firebase" }
firebase-analytics = { module = "dev.gitlive:firebase-analytics", version.ref = "gitlive-firebase" }
firebase-crashlytics = { module = "dev.gitlive:firebase-crashlytics", version.ref = "gitlive-firebase" }
crashkios-crashlytics = { module = "co.touchlab.crashkios:crashlytics", version.ref = "crashkios" }

supabase-postgrest = { module = "io.github.jan-tennert.supabase:postgrest-kt", version.ref = "supabase" }
supabase-auth = { module = "io.github.jan-tennert.supabase:auth-kt", version.ref = "supabase" }
supabase-storage = { module = "io.github.jan-tennert.supabase:storage-kt", version.ref = "supabase" }

revenuecat-core = { module = "com.revenuecat.purchases:purchases-kmp-core", version.ref = "revenuecat" }
revenuecat-result = { module = "com.revenuecat.purchases:purchases-kmp-result", version.ref = "revenuecat" }

# Robolectric: runs Compose UI tests (runComposeUiTest) on the JVM host (testAndroidHostTest),
# so the design-system tests gate in CI without a device/emulator. Test-only, androidHostTest source set.
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }

# Cross-platform haptics (Android + iOS), no native cinterop. Core is Compose-free; -compose adds rememberVibrator().
multihaptic-core = { module = "top.ltfan.multihaptic:multihaptic-core", version.ref = "multihaptic" }
multihaptic-compose = { module = "top.ltfan.multihaptic:multihaptic-compose", version.ref = "multihaptic" }

# Calf adaptive nav bar (native UITabBar on iOS / Material3 NavigationBar on Android). Hosted in
# :shared-ui-nav — the toolkit's single, deliberate Material3 dependency, shipped via :shared/FrnkKit.
calf-ui = { module = "com.mohamedrejeb.calf:calf-ui", version.ref = "calf" }

# Compose Unstyled
icons-lucide = { module = "com.composables:icons-lucide-cmp", version.ref = "iconsLucide" }
compose-unstyled-primitives = { module = "com.composables:composeunstyled-primitives", version.ref = "compose-unstyled" }
compose-unstyled-theming = { module = "com.composables:composeunstyled-theming", version.ref = "compose-unstyled" }
compose-unstyled-platformtheme = { module = "com.composables:composeunstyled-platformtheme", version.ref = "compose-unstyled" }
compose-unstyled-button = { module = "com.composables:composeunstyled-button", version.ref = "compose-unstyled" }
compose-unstyled-icon = { module = "com.composables:composeunstyled-icon", version.ref = "compose-unstyled" }
compose-unstyled-separators = { module = "com.composables:composeunstyled-separators", version.ref = "compose-unstyled" }
compose-ripple-indication = { module = "com.composables:ripple-indication", version.ref = "ripple-indication" }

compose-ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "compose-multiplatform" }
compose-ui-tooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "compose-multiplatform" }
compose-ui-backhandler = { module = "org.jetbrains.compose.ui:ui-backhandler", version.ref = "compose-multiplatform" }
# Compose Multiplatform UI-test runtime (runComposeUiTest). Referenced via the direct coordinate
# rather than the `compose.uiTest` Gradle accessor, which is gated behind an @ExperimentalComposeLibrary
# opt-in. Test-only, androidHostTest source set (runs under Robolectric).
compose-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "compose-multiplatform" }
# Contributes the androidx.activity.ComponentActivity declaration to the (host) test manifest so the
# Compose test host can launch it under Robolectric. Pinned to the AndroidX Compose version CMP resolves to.
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "androidx-compose-ui" }


[plugins]
kotlin-multiplatform               = { id = "org.jetbrains.kotlin.multiplatform",       version.ref = "kotlin" }
kotlin-compose                     = { id = "org.jetbrains.kotlin.plugin.compose",      version.ref = "kotlin" }
kotlin-serialization               = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-multiplatform              = { id = "org.jetbrains.compose",                    version.ref = "compose-multiplatform" }
android-application                = { id = "com.android.application",                  version.ref = "agp" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
sqldelight                         = { id = "app.cash.sqldelight",                      version.ref = "sqldelight" }
ktlint                             = { id = "org.jlleitschuh.gradle.ktlint",            version.ref = "ktlint" }
google-services                    = { id = "com.google.gms.google-services",           version.ref = "google-services" }
firebase-crashlytics               = { id = "com.google.firebase.crashlytics",          version.ref = "firebase-crashlytics-gradle" }
